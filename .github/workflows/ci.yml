name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System information
        run: |
          echo "=== macOS Version ==="
          sw_vers
          echo "=== Xcode Version ==="
          xcodebuild -version
          echo "=== Available Destinations ==="
          xcodebuild -project SwiftDictate.xcodeproj -scheme SwiftDictate -showdestinations

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild -project SwiftDictate.xcodeproj \
            -scheme SwiftDictate \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY='-' \
            build | xcbeautify --renderer github-actions

      - name: Run Tests (Debug)
        run: |
          set -o pipefail
          xcodebuild -project SwiftDictate.xcodeproj \
            -scheme SwiftDictate \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY='-' \
            test | xcbeautify --renderer github-actions

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          retention-days: 7
